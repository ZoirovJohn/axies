services:
  axies-next:
    container_name: axies-next
    restart: always
    image: node:20.10.0
    ports:
      - "4006:4006"
    env_file:
      - .env.production
    volumes:
      - ./:/usr/src/axies-next
    working_dir: /usr/src/axies-next

    networks:
      - client-network

    # FOR PRODUCTION
    command: bash -c "yarn install --frozen-lockfile && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge


# axies-next: localhost:4006 <==> container: 4006
# axies-api: localhost:4007 <==> container: 4007
# axies-batch: localhost:4008 <==> container: 4008
