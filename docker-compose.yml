services:
  axies-next:
    container_name: axies-next
    restart: always
    build: .
    image: axies-next:local
    ports:
      - "4006:4006"
    env_file:
      - .env.production
    environment:
      - PORT=4006

    networks:
      - client-network

    # FOR PRODUCTION
    command: yarn start

networks:
  client-network:
    driver: bridge


# axies-next: localhost:4006 <==> container: 4006
# axies-api: localhost:4007 <==> container: 4007
# axies-batch: localhost:4008 <==> container: 4008
